<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nigga's Birthday 😝</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    background:
        radial-gradient(circle at 20% 20%, #34205f 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #531c45 0%, transparent 35%),
        #07070d;
    color: white;
}

/* ================= BACKGROUND ================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .25;
    animation: moveGlow 12s infinite alternate ease-in-out;
}

.glow.one {
    background: #8b5cf6;
    top: -150px;
    left: -150px;
}

.glow.two {
    background: #ec4899;
    bottom: -180px;
    right: -150px;
    animation-delay: -5s;
}

@keyframes moveGlow {
    from {
        transform: translate(0,0) scale(1);
    }
    to {
        transform: translate(100px,70px) scale(1.3);
    }
}

/* ================= PARTICLES ================= */

.particle {
    position: absolute;
    opacity: .5;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: .6;
    }

    85% {
        opacity: .6;
    }

    to {
        transform: translateY(-15vh) rotate(360deg);
        opacity: 0;
    }
}

/* ================= MAIN ================= */

.page {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.countdown-screen {
    width: min(1100px, 100%);
    text-align: center;
}

/* ================= TITLE ================= */

.small-title {
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: .55;
    margin-bottom: 18px;
}

.main-title {
    font-size: clamp(34px, 6vw, 76px);
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    margin-bottom: 55px;

    background: linear-gradient(
        90deg,
        #fff,
        #e9d5ff,
        #f9a8d4,
        #fff
    );

    background-size: 250%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: shine 5s linear infinite;
}

@keyframes shine {
    from {
        background-position: 0%;
    }
    to {
        background-position: 250%;
    }
}

/* ================= COUNTDOWN ================= */

.timer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(8px, 2vw, 20px);
    flex-wrap: nowrap;
}

.time-group {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.flip-card {
    position: relative;

    width: clamp(65px, 16vw, 170px);
    height: clamp(80px, 18vw, 190px);

    border-radius: clamp(10px, 2vw, 22px);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.035)
        );

    border: 1px solid rgba(255,255,255,.14);

    box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.15);

    backdrop-filter: blur(20px);

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

.flip-card::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;

    background: rgba(255,255,255,.14);

    z-index: 3;
}

.flip-card::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            transparent 48%,
            rgba(0,0,0,.25) 50%,
            transparent 52%
        );

    pointer-events: none;
}

.number {
    font-size: clamp(38px, 9vw, 100px);
    font-weight: 900;
    letter-spacing: -4px;
    font-variant-numeric: tabular-nums;

    text-shadow:
        0 0 30px rgba(255,255,255,.18);

    transition: transform .15s ease;
}

.flip {
    animation: flip .45s cubic-bezier(.4,0,.2,1);
}

@keyframes flip {
    0% {
        transform: rotateX(0deg);
    }

    45% {
        transform: rotateX(-85deg);
        opacity: .3;
    }

    100% {
        transform: rotateX(0deg);
        opacity: 1;
    }
}

.label {
    margin-top: 13px;
    font-size: clamp(12px, 2vw, 17px);
    font-weight: 800;
    letter-spacing: 4px;
    opacity: .45;
}

/* ================= SEPARATORS ================= */

.separator {
    font-size: clamp(25px, 5vw, 50px);
    font-weight: 900;
    opacity: .35;
    margin-bottom: 30px;
}

/* ================= BOTTOM ================= */

.bottom-text {
    margin-top: 55px;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: .35;
}

/* ================= BIRTHDAY SCREEN ================= */

.birthday {
    position: fixed;
    inset: 0;
    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    opacity: 0;
    pointer-events: none;

    background:
        radial-gradient(circle at 50% 30%, #6d28d9, transparent 35%),
        radial-gradient(circle at 20% 80%, #db2777, transparent 35%),
        #09000f;

    transition: opacity 1.2s ease;
}

.birthday.show {
    opacity: 1;
    pointer-events: auto;
}

.birthday-content {
    position: relative;
    z-index: 10;
    padding: 30px;
}

.cake {
    font-size: clamp(80px, 15vw, 150px);
    animation: cakeBounce 1.5s infinite ease-in-out;
}

@keyframes cakeBounce {
    0%,100% {
        transform: translateY(0) rotate(-2deg);
    }

    50% {
        transform: translateY(-18px) rotate(2deg);
    }
}

.birthday h1 {
    font-size: clamp(45px, 9vw, 110px);
    font-weight: 1000;
    letter-spacing: -4px;
    line-height: .95;

    background: linear-gradient(
        90deg,
        #fff,
        #f9a8d4,
        #c4b5fd,
        #fff
    );

    background-size: 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: shine 3s linear infinite;
}

.birthday p {
    margin-top: 25px;
    font-size: clamp(16px, 3vw, 25px);
    opacity: .8;
}

/* ================= BALLOONS ================= */

.balloon {
    position: absolute;
    bottom: -150px;
    font-size: clamp(50px, 8vw, 100px);
    animation: balloonRise linear forwards;
}

@keyframes balloonRise {
    0% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-55vh) rotate(7deg);
    }

    100% {
        transform: translateY(-120vh) rotate(-5deg);
    }
}

/* ================= CONFETTI ================= */

.confetti {
    position: absolute;
    width: 10px;
    height: 18px;
    top: -30px;

    animation:
        confettiFall linear forwards,
        confettiSpin .8s linear infinite;
}

@keyframes confettiFall {
    to {
        transform: translateY(115vh);
    }
}

@keyframes confettiSpin {
    to {
        rotate: 360deg;
    }
}

/* ================= FIREWORK ================= */

.firework {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
    0% {
        box-shadow: 0 0 0 0 white;
        opacity: 1;
    }

    100% {
        box-shadow:
            0 -100px 0 white,
            70px -70px 0 #f9a8d4,
            100px 0 0 #c4b5fd,
            70px 70px 0 #facc15,
            0 100px 0 white,
            -70px 70px 0 #fb7185,
            -100px 0 0 #a78bfa,
            -70px -70px 0 #f472b6;
        opacity: 0;
    }
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .main-title {
        margin-bottom: 38px;
    }

    .timer {
        gap: 6px;
    }

    .flip-card {
        border-radius: 12px;
    }

    .separator {
        margin-bottom: 25px;
        font-size: 20px;
    }

    .label {
        letter-spacing: 2px;
        font-size: 10px;
    }

    .bottom-text {
        margin-top: 40px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<!-- COUNTDOWN -->
<main class="page" id="countdownPage">

    <section class="countdown-screen">

        <div class="small-title">
            September 9
        </div>

        <h1 class="main-title">
            Nigga's birthday coming soon 😝
        </h1>

        <div class="timer">

            <div class="time-group">
                <div class="flip-card">
                    <div class="number" id="days">00</div>
                </div>
                <div class="label">D</div>
            </div>

            <div class="separator">:</div>

            <div class="time-group">
                <div class="flip-card">
                    <div class="number" id="hours">00</div>
                </div>
                <div class="label">H</div>
            </div>

            <div class="separator">:</div>

            <div class="time-group">
                <div class="flip-card">
                    <div class="number" id="minutes">00</div>
                </div>
                <div class="label">M</div>
            </div>

            <div class="separator">:</div>

            <div class="time-group">
                <div class="flip-card">
                    <div class="number" id="seconds">00</div>
                </div>
                <div class="label">S</div>
            </div>

        </div>

        <div class="bottom-text">
            THE WAIT IS REAL 😭
        </div>

    </section>
</main>


<!-- BIRTHDAY -->
<section class="birthday" id="birthday">

    <div class="birthday-content">

        <div class="cake">🎂</div>

        <h1>
            HAPPIEST<br>
            BIRTHDAY<br>
            PRATYUSH 😭❤️
        </h1>

        <p>
            September 9 is officially your day 😝🎉
        </p>

    </div>

</section>


<script>

/* =========================================
   COUNTDOWN
   ========================================= */

const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

const birthdayScreen = document.getElementById("birthday");

let lastValues = {
    days: "",
    hours: "",
    minutes: "",
    seconds: ""
};


/*
   Birthday:
   September 9, 2026 at 00:00:00
*/
function getBirthdayDate() {

    const now = new Date();

    let year = now.getFullYear();

    let birthday = new Date(
        year,
        8,
        9,
        0,
        0,
        0,
        0
    );

    /*
       If this year's birthday has already passed,
       use next year's birthday.
    */
    if (now >= birthday) {
        birthday = new Date(
            year + 1,
            8,
            9,
            0,
            0,
            0,
            0
        );
    }

    return birthday;
}

let target = getBirthdayDate();


function pad(number) {
    return String(number).padStart(2, "0");
}


function updateNumber(element, value, key) {

    if (lastValues[key] !== value) {

        element.textContent = value;

        element.classList.remove("flip");

        /*
           Force browser reflow so animation
           can restart every time.
        */
        void element.offsetWidth;

        element.classList.add("flip");

        lastValues[key] = value;
    }
}


function updateCountdown() {

    const now = new Date();

    let difference = target - now;

    /*
       Birthday reached
    */
    if (difference <= 0) {

        document.getElementById("countdownPage")
            .style.display = "none";

        birthdayScreen.classList.add("show");

        launchCelebration();

        return;
    }

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
        (difference / 1000) % 60
    );

    updateNumber(
        daysEl,
        pad(days),
        "days"
    );

    updateNumber(
        hoursEl,
        pad(hours),
        "hours"
    );

    updateNumber(
        minutesEl,
        pad(minutes),
        "minutes"
    );

    updateNumber(
        secondsEl,
        pad(seconds),
        "seconds"
    );
}


updateCountdown();

setInterval(updateCountdown, 100);


/* =========================================
   FLOATING BACKGROUND EMOJIS
   ========================================= */

const emojis = [
    "❤️",
    "💜",
    "✨",
    "⭐",
    "😝",
    "🎈",
    "🎉",
    "💫",
    "🥳"
];

function createParticle() {

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.textContent =
        emojis[Math.floor(Math.random() * emojis.length)];

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.fontSize =
        (12 + Math.random() * 22) + "px";

    particle.style.animationDuration =
        (8 + Math.random() * 12) + "s";

    particle.style.animationDelay =
        (-Math.random() * 10) + "s";

    document.querySelector(".background")
        .appendChild(particle);
}

for (let i = 0; i < 35; i++) {
    createParticle();
}


/* =========================================
   BIRTHDAY CELEBRATION
   ========================================= */

let celebrationStarted = false;

function launchCelebration() {

    if (celebrationStarted) return;

    celebrationStarted = true;

    /*
       Balloons
    */

    const balloonEmojis = [
        "🎈",
        "🎈",
        "🎈",
        "🎈",
        "🎈"
    ];

    for (let i = 0; i < 25; i++) {

        setTimeout(() => {

            const balloon =
                document.createElement("div");

            balloon.className = "balloon";

            balloon.textContent =
                balloonEmojis[
                    Math.floor(
                        Math.random() *
                        balloonEmojis.length
                    )
                ];

            balloon.style.left =
                Math.random() * 100 + "%";

            balloon.style.animationDuration =
                (5 + Math.random() * 5) + "s";

            birthdayScreen.appendChild(balloon);

        }, i * 180);
    }


    /*
       Confetti
    */

    for (let i = 0; i < 180; i++) {

        setTimeout(() => {

            const confetti =
                document.createElement("div");

            confetti.className = "confetti";

            confetti.style.left =
                Math.random() * 100 + "%";

            confetti.style.animationDuration =
                (3 + Math.random() * 5) + "s";

            confetti.style.animationDelay =
                Math.random() * 2 + "s";

            confetti.style.background =
                [
                    "#f472b6",
                    "#a78bfa",
                    "#facc15",
                    "#60a5fa",
                    "#34d399",
                    "#fb7185"
                ][
                    Math.floor(Math.random() * 6)
                ];

            birthdayScreen.appendChild(confetti);

        }, Math.random() * 2500);
    }


    /*
       Fireworks repeatedly
    */

    function firework() {

        const fw =
            document.createElement("div");

        fw.className = "firework";

        fw.style.left =
            (15 + Math.random() * 70) + "%";

        fw.style.top =
            (10 + Math.random() * 55) + "%";

        birthdayScreen.appendChild(fw);

        setTimeout(() => {
            fw.remove();
        }, 1400);
    }

    for (let i = 0; i < 20; i++) {

        setTimeout(
            firework,
            i * 350
        );
    }

    setInterval(firework, 1800);
}

</script>

</body>
</html>
