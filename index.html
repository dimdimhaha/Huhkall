<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 16px 20px;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      max-width: 800px;
      margin: 12px auto;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #e8f0fe;
    }

    .ai {
      background: white;
      border: 1px solid #ddd;
    }

    .welcome {
      text-align: center;
      margin-top: 20vh;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
    }

    .input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 15px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 95%;
      }

      .welcome h1 {
        font-size: 26px;
      }

      .input-area {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    My AI
  </header>

  <div id="chat">

    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Your personal AI assistant</p>
    </div>

  </div>

  <div class="input-area">

    <input
      id="message"
      type="text"
      placeholder="Ask anything..."
      autocomplete="off"
    >

    <button id="sendButton" onclick="sendMessage()">
      Send
    </button>

  </div>

  <script>

    const input = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });


    async function sendMessage() {

      const chat = document.getElementById("chat");
      const welcome = document.getElementById("welcome");

      const text = input.value.trim();

      if (!text) {
        return;
      }

      if (welcome) {
        welcome.remove();
      }


      // Show user's message

      const userMessage = document.createElement("div");

      userMessage.className = "message user";

      userMessage.innerText = text;

      chat.appendChild(userMessage);


      // Clear input

      input.value = "";

      sendButton.disabled = true;

      sendButton.innerText = "Thinking...";


      // Show AI loading message

      const aiMessage = document.createElement("div");

      aiMessage.className = "message ai";

      aiMessage.innerText = "Thinking...";

      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;


      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })

        });


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error || "AI request failed"
          );

        }


        // Display AI response

        aiMessage.innerText =
          data.reply || "No response received.";


      } catch (error) {

        console.error(error);

        aiMessage.innerText =
          "Sorry, something went wrong.\n\n" +
          error.message;

      }


      sendButton.disabled = false;

      sendButton.innerText = "Send";

      input.focus();

      chat.scrollTop = chat.scrollHeight;

    }

  </script>

</body>
